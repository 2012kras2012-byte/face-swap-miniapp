<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Замена Лица</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { 
            background-color: #1c1c1e; 
            color: white; 
            font-family: sans-serif; 
            text-align: center; 
            padding: 20px; 
            margin: 0;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
        }
        h2 { margin-bottom: 5px; }
        p { color: #aaa; font-size: 14px; margin-bottom: 20px; }
        
        /* Стили для кнопки загрузки */
        .upload-btn {
            background-color: #2481cc;
            color: white;
            border: none;
            padding: 15px;
            font-size: 16px;
            border-radius: 10px;
            width: 100%;
            font-weight: bold;
            cursor: pointer;
            display: block;
        }
        .upload-btn:active { background-color: #1b5f99; }

        /* Стили для превью фото */
        #preview {
            max-width: 100%;
            border-radius: 15px;
            margin-top: 20px;
            display: none;
            border: 2px solid #2481cc;
        }

        /* Кнопка "Далее" (появится после загрузки) */
        #nextBtn {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 15px;
            font-size: 16px;
            border-radius: 10px;
            width: 100%;
            font-weight: bold;
            margin-top: 20px;
            display: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Шаг 1: Ваше фото</h2>
        <p>Загрузите четкое фото лица (анфас, без очков).</p>
        
        <!-- Скрытый инпут для выбора файла -->
        <input type="file" id="fileInput" accept="image/*" style="display: none;">
        
        <!-- Кнопка для вызова инпута -->
        <button class="upload-btn" id="uploadBtn">Выбрать фото из галереи</button>
        
        <!-- Место для показа фото -->
        <img id="preview" alt="Превью фото" />
        
        <!-- Кнопка "Далее" -->
        <button id="nextBtn">Фото готово, продолжить</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const fileInput = document.getElementById('fileInput');
        const uploadBtn = document.getElementById('uploadBtn');
        const preview = document.getElementById('preview');
        const nextBtn = document.getElementById('nextBtn');

        // 1. Нажатие на кнопку открывает галерею
        uploadBtn.addEventListener('click', () => {
            fileInput.click();
        });

        // 2. Когда фото выбрано - показываем его и кнопку "Далее"
        fileInput.addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    preview.src = e.target.result;
                    preview.style.display = 'block'; // Показываем картинку
                    
                    uploadBtn.style.display = 'none'; // Прячем кнопку загрузки
                    nextBtn.style.display = 'block';  // Показываем кнопку "Далее"
                }
                reader.readAsDataURL(file);
            }
        });

        // 3. Что делать при нажатии "Далее" (пока просто тест)
        nextBtn.addEventListener('click', () => {
            // В будущем здесь будет отправка фото на сервер
            tg.showAlert("Отлично! Фото загружено. В следующем шаге мы отправим его на обработку.");
        });
    </script>
</body>
</html>
