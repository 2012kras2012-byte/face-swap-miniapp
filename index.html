<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Галерея шаблонов</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { 
            background-color: #1c1c1e; 
            color: white; 
            font-family: sans-serif; 
            padding: 15px; 
            margin: 0;
        }
        h2 { text-align: center; margin-bottom: 5px; font-size: 20px;}
        p.subtitle { text-align: center; color: #aaa; font-size: 13px; margin-bottom: 20px; }
        
        /* Сетка для галереи (2 колонки) */
        .gallery {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        /* Карточка шаблона */
        .template-card {
            background-color: #2c2c2e;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            border: 2px solid transparent;
            transition: border 0.3s;
        }
        
        .template-card.selected {
            border: 2px solid #2481cc; /* Синяя рамка при выборе */
        }

        .template-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            display: block;
        }

        .template-info {
            padding: 8px;
            text-align: center;
        }
        
        .template-title { font-size: 12px; font-weight: bold; margin-bottom: 4px; }
        .template-price { font-size: 11px; color: #f1c40f; } /* Желтый цвет для цены */

        /* Кнопка загрузки фото (появляется после выбора шаблона) */
        .action-section {
            margin-top: 25px;
            display: none; /* Скрыто, пока не выбран шаблон */
        }
        
        .upload-btn {
            background-color: #2481cc;
            color: white;
            border: none;
            padding: 15px;
            font-size: 16px;
            border-radius: 10px;
            width: 100%;
            font-weight: bold;
            cursor: pointer;
        }
        
        #preview {
            max-width: 100%;
            border-radius: 12px;
            margin-top: 15px;
            display: none;
            border: 2px solid #2481cc;
        }
        
        #payBtn {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 15px;
            font-size: 16px;
            border-radius: 10px;
            width: 100%;
            font-weight: bold;
            margin-top: 15px;
            display: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h2>Выберите стиль</h2>
    <p class="subtitle">Нажмите на картинку, чтобы выбрать шаблон</p>
    
    <!-- ГАЛЕРЕЯ ШАБЛОНОВ -->
    <div class="gallery">
        <!-- Шаблон 1 (Ваша картинка с икрой) -->
        <div class="template-card" onclick="selectTemplate(1, 'Красная площадь', '15 Stars')">
            <!-- Ссылка на картинку (пока поставим заглушку, потом заменим на вашу ссылку) -->
            <img src="https://images.unsplash.com/photo-1543353071-873f17a7a088?q=80&w=400&auto=format&fit=crop" alt="Красная площадь">
            <div class="template-info">
                <div class="template-title">Зимняя сказка</div>
                <div class="template-price">15 ⭐</div>
            </div>
        </div>

        <!-- Шаблон 2 (Пример) -->
        <div class="template-card" onclick="selectTemplate(2, 'Киберпанк', '20 Stars')">
            <img src="https://images.unsplash.com/photo-1578632767115-351597cf2477?q=80&w=400&auto=format&fit=crop" alt="Киберпанк">
            <div class="template-info">
                <div class="template-title">Киберпанк</div>
                <div class="template-price">20 ⭐</div>
            </div>
        </div>
    </div>

    <!-- БЛОК ЗАГРУЗКИ ФОТО (появляется после выбора шаблона) -->
    <div class="action-section" id="actionSection">
        <h3 style="text-align:center; margin-bottom: 10px;">Шаг 2: Ваше лицо</h3>
        <input type="file" id="fileInput" accept="image/*" style="display: none;">
        <button class="upload-btn" id="uploadBtn">Выбрать фото из галереи</button>
        <img id="preview" alt="Ваше фото" />
        
        <button id="payBtn">Оплатить и сгенерировать</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        let selectedTemplateId = null; // Здесь храним ID выбранного шаблона

        const actionSection = document.getElementById('actionSection');
        const fileInput = document.getElementById('fileInput');
        const uploadBtn = document.getElementById('uploadBtn');
        const preview = document.getElementById('preview');
        const payBtn = document.getElementById('payBtn');

        // Функция выбора шаблона
        window.selectTemplate = function(id, title, price) {
            selectedTemplateId = id;
            
            // Визуально выделяем выбранную карточку
            document.querySelectorAll('.template-card').forEach(card => {
                card.classList.remove('selected');
            });
            // Находим нажатую карточку и добавляем рамку (упрощенно)
            event.currentTarget.classList.add('selected');

            // Показываем блок с загрузкой фото
            actionSection.style.display = 'block';
            
            // Сбрасываем предыдущее фото, если оно было
            preview.style.display = 'none';
            payBtn.style.display = 'none';
            uploadBtn.style.display = 'block';
            
            // Прокручиваем вниз к загрузке
            actionSection.scrollIntoView({ behavior: 'smooth' });
        };

        // Логика загрузки фото
        uploadBtn.addEventListener('click', () => {
            fileInput.click();
        });

        fileInput.addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                    
                    uploadBtn.style.display = 'none'; 
                    payBtn.style.display = 'block'; // Показываем кнопку оплаты
                }
                reader.readAsDataURL(file);
            }
        });

        // Заглушка для кнопки оплаты
        payBtn.addEventListener('click', () => {
            tg.showAlert(`Вы выбрали шаблон №${selectedTemplateId}. Здесь появится окно оплаты Telegram Stars.`);
        });
    </script>
</body>
</html>
