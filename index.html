<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Face Swap Bot</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #1c1c1e;
            color: white;
            font-family: sans-serif;
            text-align: center;
            padding-top: 30px;
            margin: 0;
        }
        .container {
            padding: 20px;
        }
        .upload-btn {
            background-color: #2481cc;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 10px;
            margin-top: 20px;
            cursor: pointer;
            width: 80%;
            font-weight: bold;
        }
        #preview {
            max-width: 100%;
            border-radius: 10px;
            margin-top: 20px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Замена лица</h1>
        <p>Загрузите вашу фотографию, чтобы мы вставили её в видео.</p>
        
        <input type="file" id="fileInput" accept="image/*" style="display: none;">
        
        <button class="upload-btn" id="uploadBtn">Выбрать фото</button>
        
        <img id="preview" alt="Ваше фото" />
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const fileInput = document.getElementById('fileInput');
        const uploadBtn = document.getElementById('uploadBtn');
        const preview = document.getElementById('preview');

        uploadBtn.addEventListener('click', () => {
            fileInput.click();
        });

        fileInput.addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                    uploadBtn.textContent = 'Фото выбрано';
                    uploadBtn.style.backgroundColor = '#28a745';
                }
                reader.readAsDataURL(file);
            }
        });
    </script>
</body>
</html>
