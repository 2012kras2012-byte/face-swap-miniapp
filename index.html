<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест Генерации</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background-color: #1c1c1e; color: white; font-family: sans-serif; text-align: center; padding: 20px; }
        button { background-color: #2481cc; color: white; border: none; padding: 15px; font-size: 16px; border-radius: 10px; margin-top: 20px; width: 100%; font-weight: bold; }
        #result { margin-top: 20px; font-size: 14px; word-wrap: break-word; }
        img { max-width: 100%; border-radius: 10px; margin-top: 15px; display: none; }
    </style>
</head>
<body>
    <h2>Тест нейросети</h2>
    <p>Нажми кнопку, чтобы сгенерировать картинку через API.</p>
    
    <button id="testBtn">Сгенерировать кота 🐱</button>
    
    <div id="result"></div>
    <img id="imageResult" alt="Результат генерации" />

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        document.getElementById('testBtn').addEventListener('click', async () => {
            const btn = document.getElementById('testBtn');
            const resultDiv = document.getElementById('result');
            const img = document.getElementById('imageResult');

            btn.disabled = true;
            btn.textContent = 'Генерирую... (ждите)';
            resultDiv.innerHTML = 'Отправляем запрос в Ofox...';
            img.style.display = 'none';

            // ВАЖНО: Вставьте сюда ваш НОВЫЙ ключ из Ofox
            const API_KEY = 'sk-of-yzMQeHOdwfjXwAyujuwMQUkHQzgETcrMBpBwnvuNHTrTIkoWTPkGJCcnyfOSVDqu'; 

            try {
                // Отправляем запрос в Ofox
                const response = await fetch('https://api.ofox.ai/v1/images/generations', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${API_KEY}`
                    },
                    body: JSON.stringify({
                        model: "openai/gpt-image-1", // или "dall-e-3" если первая не сработает
                        prompt: "Нарисуй милого кота в космическом шлеме",
                        n: 1,
                        size: "1024x1024"
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    resultDiv.innerHTML = '✅ Успех! Картинка готова:';
                    // В зависимости от того, как Ofox возвращает картинку (ссылкой или base64)
                    if (data.data && data.data[0].url) {
                        img.src = data.data[0].url;
                    } else if (data.data && data.data[0].b64_json) {
                        img.src = `data:image/png;base64,${data.data[0].b64_json}`;
                    }
                    img.style.display = 'block';
                } else {
                    resultDiv.innerHTML = `<span style="color:red">❌ Ошибка от сервера: ${JSON.stringify(data)}</span>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<span style="color:red">❌ Ошибка сети: ${error.message}</span>`;
            } finally {
                btn.disabled = false;
                btn.textContent = 'Сгенерировать кота 🐱';
            }
        });
    </script>
</body>
</html>
